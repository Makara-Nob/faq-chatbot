# JAVA: your Jenkinsfile / GitHub Actions running `mvn verify`.
# A green badge on a CV project says "I test my code" before anyone reads it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        run: pytest
        env:
          # Never the real secret - CI only needs a syntactically valid one.
          SECRET_KEY: ci-only-test-secret-key-value
          DATABASE_URL: "sqlite:///./ci.db"
          SEED_ADMIN: "false"
