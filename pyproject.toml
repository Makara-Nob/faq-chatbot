# JAVA: pom.xml's <build><plugins> section - Checkstyle, Spotless, Surefire
# config, all in one file. Modern Python puts tool config here.

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle errors   I = import sorting (isort)
# B   = bugbear (real bug patterns)   UP = pyupgrade (modernise syntax)
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # Depends() in defaults is the FastAPI idiom, not a bug
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]        # asserts are the point of a test file

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -q here: `dev test` already passes it, and pytest treats a repeated -q as
# "even quieter", which hides the pass/fail summary line entirely.
filterwarnings = [
    "ignore::DeprecationWarning",
]
